version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: ecom-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: discover
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ecom-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      
  # Redis Cache for Token Blacklist
  redis:
    image: redis:7-alpine
    container_name: ecom-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecom-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Build Helper module and cache in Maven repo
  helper-builder:
    image: maven:3.9-eclipse-temurin-21
    container_name: ecom-helper-builder
    volumes:
      - ./microservices/helper:/app
      - maven-repo:/root/.m2/repository
    working_dir: /app
    command: sh -c "mvn clean install -DskipTests && touch /tmp/helper-built && tail -f /dev/null"
    networks:
      - ecom-network
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/helper-built"]
      interval: 5s
      timeout: 3s
      retries: 1
      start_period: 60s      

  # Eureka Server (Service Discovery)
  microspring:
    build:
      context: ./microservices/microspring
      dockerfile: Dockerfile
    container_name: ecom-eureka
    ports:
      - "8761:8761"
    networks:
      - ecom-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - mysql
      
  # API Gateway
  microgateway:
    build:
      context: ./microservices/microgateway
      dockerfile: Dockerfile
    container_name: ecom-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://microspring:8761/eureka/
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      microspring:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecom-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  
      
  # Authentication Service
  microauth:
    build:
      context: ./microservices/microauth
      dockerfile: Dockerfile
    container_name: ecom-auth
    ports:
      - "8081:8081"
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://microspring:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/discover?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      microspring:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecom-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s    
   
  # Products Service (depends on Helper module)
  microproducts:
    build:
      context: ./microservices
      dockerfile: microproducts/Dockerfile
    container_name: ecom-products
    ports:
      - "8082:8082"
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://microspring:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/discover?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=12345678
    volumes:
      - maven-repo:/root/.m2/repository
    depends_on:
      helper-builder:
        condition: service_healthy
      microspring:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - ecom-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s   

networks:
  ecom-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  maven-repo:
    driver: local
  redis_data:
    driver: local

