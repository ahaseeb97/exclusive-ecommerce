spring.application.name=microproducts

server.port=8082

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.fetch-registry=true

eureka.client.register-with-eureka=true

eureka.instance.prefer-ip-address=true

eureka.instance.lease-renewal-interval-in-seconds=30

eureka.instance.lease-expiration-duration-in-seconds=90

spring.datasource.url=jdbc:mysql://localhost:3306/discover

spring.jpa.hibernate.ddl-auto=update

spring.datasource.username=

spring.datasource.password=

management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=always

logging.level.com.netflix.discovery=debug

logging.level.com.netflix.eureka=debug

# AWS S3 Configuration
aws.s3.bucket-name=mhs-dev
aws.s3.access-key=
aws.s3.secret-key=
aws.s3.presigned-url-expiration-minutes=60
s3.image.path.prefix=local/products/images/

