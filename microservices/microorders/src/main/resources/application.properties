spring.application.name=microorders

server.port=8083

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.fetch-registry=true

eureka.client.register-with-eureka=true

eureka.instance.prefer-ip-address=true

spring.datasource.url=jdbc:mysql://localhost:3306/discover

spring.datasource.username=

spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

# AWS S3 Configuration
aws.s3.bucket-name=mhs-dev
aws.s3.access-key=
aws.s3.secret-key=
aws.s3.presigned-url-expiration-minutes=60
s3.image.path.prefix=local/products/images/
